version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine bumps instead of one per package.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades of the framework stack are deliberate, tested projects (Next 16 brings React
      # 19 and async cookies()/params), not something to merge from a weekly PR.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Tracks the Node version the code runs on (CI uses 22), not the newest Node. Types for a
      # newer major would accept APIs that then fail at runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Pre-1.0, so a minor bump can be breaking. This one owns the session cookies, where a
      # silent change already cost a login outage once; patches only.
      - dependency-name: "@supabase/ssr"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
